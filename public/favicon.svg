<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="scGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#scGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
  
  <!-- Code Brackets & Slash: </> -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)">
    <!-- Left bracket < -->
    <path d="M 42 44 L 26 64 L 42 84" />
    <!-- Center slash / -->
    <path d="M 72 38 L 56 90" />
    <!-- Right bracket > -->
    <path d="M 86 44 L 102 64 L 86 84" />
  </g>
</svg>
